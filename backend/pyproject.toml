[project]
name = "backend"
version = "2.0.0"
description = "fastcore 后端工程"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "anyio==4.15.1",
    "asyncmy==0.2.16",
    "cryptography>=50.0.2",
    "email-validator==2.3.0",
    # fastapi-limiter 的 Redis 实现依赖 0.137 之前的扁平路由列表。
    "fastapi==0.136.3",
    "fastapi-limiter==0.1.6",
    "greenlet>=3.5.6",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "pymysql==1.2.3",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "rich==15.0.0",
    "sqlalchemy==2.1.4",
    "starlette==1.8.0",
    "typer==0.27.3",
    "ua-parser==1.0.2",
    "uvicorn[standard]==0.54.0",
]
[dependency-groups]
ai = [
    "chromadb==1.5.9",
    "fastembed==0.9.0",
    "jieba==0.42.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core==1.6.10",
    "langchain-openai==1.7.1",
    "openai==3.29.0",
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    "whoosh==2.7.4",
]
dev = [
    "fakeredis>=2.39.0,<3",   # 测试：内存 Redis，配合 TESTING
    "httpx2==2.13.1",        # Anthropic 1.x SDK 的 MockTransport
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",  # 异步测试支持
    "ruff==0.17.0",          # 代码检查、格式化
]

[tool.uv]
default-groups = ["ai", "dev"]     # 默认完整 AI + 开发工具；基础生产依赖单独导出 requirements-core.txt

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 200
indent-width = 4
preview = false
fix = false
show-fixes = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "FAST",
    "F",
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "B904",  # Within an `except` clause
    "B010",  # Do not call with a constant attribute value.
    "B009",  # Do not use getattr() with a constant attribute value.
    "E712",  # Avoid equality comparisons to `False`; use `not getattr(self.model, "is_deleted"):` for false checks
    "W293",  # blank line with whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 先设置 TESTING/SQLite 环境，再 import 应用
"tests/ux_e2e_server.py" = ["E402"]
"app/common/enums.py" = ["UP042"]  # 保留现有 str(Enum) 语义，避免依赖升级改变枚举行为。

[tool.ruff.format]
docstring-code-format = true
preview = false
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
