# FastAPI Admin 前端部署示例
# 使用方法：
# 1. 前端执行 pnpm build，生成 dist 目录
# 2. 将 root 改成服务器上 dist 的真实绝对路径
# 3. 将 server_name 改成你的域名或服务器 IP
# 4. 将本文件放到 /etc/nginx/conf.d/fastapiadmin.conf 后执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 改成你的前端构建产物目录，例如 /www/wwwroot/fastapiadmin/frontend/web/dist
    # 当前前端 VITE_BASE_URL=/web，所以前端页面部署在 /web/ 下。
    root /www/wwwroot/fastapiadmin/frontend/web/dist;
    index index.html;

    client_max_body_size 50m;

    location = / {
        return 302 /web/;
    }

    location = /web {
        return 302 /web/;
    }

    # Vue Router history 模式：刷新页面时返回 /web/index.html，避免 404
    location /web/ {
        rewrite ^/web/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建后的静态资源缓存
    location ^~ /web/assets/ {
        rewrite ^/web/(.*)$ /$1 break;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # WebSocket 代理：AI 流式聊天等功能需要
    location = /api/v1/ai/chat/ws {
        proxy_pass http://127.0.0.1:8008/ai/chat/ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/v1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 后端 HTTP 接口代理
    # 前端请求 /api/v1/... 时，转发到 FastAPI 后端 8008 端口
    # 这里也保留 Upgrade 头，避免线上配置未命中特定 WS location 时连接失败。
    location /api/v1/ {
        # 后端实际路由是 /system、/platform、/ai/...；
        # 这里会把浏览器里的 /api/v1/system/login 转成后端的 /system/login。
        proxy_pass http://127.0.0.1:8008/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/v1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

}
